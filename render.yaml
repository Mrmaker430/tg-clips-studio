services:
  - type: redis
    name: clip-redis
    plan: free
    ipAllowList: []

  - type: web
    name: clip-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: clip-redis
          property: connectionString
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: WHISPER_MODEL
        value: base
      - key: MAX_CLIPS
        value: "6"

  - type: worker
    name: clip-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A worker.celery_app worker --loglevel=info --concurrency=1
    plan: standard
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: clip-redis
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: WHISPER_MODEL
        value: base
      - key: MAX_CLIPS
        value: "6"
    disk:
      name: clip-tmp
      mountPath: /tmp
      sizeGB: 2
